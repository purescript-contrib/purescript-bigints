name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: purescript-contrib/setup-purescript@main
        with:
          spago: latest

      - name: Install dependencies
        run: npm install

      - name: Build source (spago)
        run: spago build

      - name: Run tests (spago)
        run: spago test
